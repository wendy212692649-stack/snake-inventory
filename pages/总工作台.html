:root{--bg:#F6F8FB;--panel:#FFFFFF;--ink:#1F2A37;--muted:#64748B;

.sect{margin:26px 0 10px;display:flex;align-items:center;gap:10px}

.dia{color:var(--blue);font-size:14px}
.btn{background:var(--blue);color:#FFFFFF;border:none;padding:8px 15px;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;border-radius:10px;transition:.15s}
.btn:hover{background:var(--blue-d);color:#fff}
.btn.ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--blue)}

.btn.sm{padding:5px 11px;font-size:11px}

th{background:#1E293B;color:#CBD5E1;font-weight:600;letter-spacing:.5px;font-size:11px}
tr:last-child td{border-bottom:none}
tr:nth-child(even){background:#F5F8FC}
.row-onsale td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.row-sold{opacity:.5}
.row-sold td:first-child{box-shadow:inset 3px 0 0 var(--muted)}
.row-sold td:first-child, .row-sold td:nth-child(2){text-decoration:line-through}
.tag{display:inline-block;padding:2px 10px;border:1px solid var(--line);font-size:11px;border-radius:20px;font-weight:600}
.tag.onsale{color:var(--blue-d);border-color:var(--blue);background:#EEF3FE}
.tag.sold{color:var(--muted);background:#F2F4F3}
.tag.self{color:var(--ink-soft)}

.card .b{padding:12px 14px}
.card .t{font-size:16px;font-weight:800;letter-spacing:.3px}
.card .m{color:var(--muted);font-size:12px;margin-top:4px}
.card .pr{color:var(--blue-d);font-weight:800;margin-top:8px;font-size:15px}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:20px;width:min(540px,92vw);max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}

.fld{margin:10px 0}
.fld label{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);background:#fff;font-size:13px;color:var(--ink);border-radius:10px;outline:none;transition:.15s}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.empty{color:var(--muted);font-style:italic;padding:20px 0}
</style></head>

    if(EDITING)body.record_id=EDITING;
    if(imgArr)body['图片']=imgArr;
    fetch('/api/total',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(()=>{closeM();boot();})
      .catch(e=>alert('保存失败：'+e.message+'（若照片较大可稍后重试，记录可能已保存）'));
  };
  const fi=document.getElementById('f_img');
  if(fi&&fi.files&&fi.files.length){
    const fd=new FormData();fd.append('file',fi.files[0]);
    fetch('/api/upload',{method:'POST',body:fd}).then(r=>r.json()).then(j=>{
      if(j&&j.file_token){const ext=(fi.files[0].name.split('.').pop()||'jpg').toLowerCase();const tp={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif'}[ext]||'image/jpeg';finish([{file_token:j.file_token,name:j.name,type:tp}]);}
      else alert('图片上传失败：'+(j&&j.error||'未知错误'));
    }).catch(e=>alert('图片上传出错：'+e));
  } else { finish(null); }
}
function openLoan(){
  if(!LIVE)return;LEDIT=true;
  const box=document.getElementById('mbox');
  box.innerHTML='<h3>新增租借</h3>'+
   '<div class="row2"><div class="fld"><label>抽屉号</label><input id="l_id"></div><div class="fld"><label>品种</label><select id="l_sp">'+opts(['玉米','牛蛇','猪鼻','王蛇'],'')+'</select></div></div>'+
   '<div class="row2"><div class="fld"><label>性别</label><select id="l_gd">'+opts(['公','母'],'')+'</select></div><div class="fld"><label>租借方</label><input id="l_party"></div></div>'+
   '<div class="row2"><div class="fld"><label>租借日期</label><input id="l_sd" type="date"></div><div class="fld"><label>归还日期</label><input id="l_ed" type="date"></div></div>'+
   '<div class="row2"><div class="fld"><label>状态</label><select id="l_st">'+opts(['租借中','逾期','已归还'],'租借中')+'</select></div><div class="fld"><label>备注</label><input id="l_memo"></div></div>'+
   '<div class="mfoot"><button class="btn ghost" onclick="closeM()">取消</button><button class="btn blood" onclick="saveLoan()">保存</button></div>';
  document.getElementById('modal').classList.add('on');
}
function saveLoan(){
  const body={抽屉号:val('l_id'),品种:val('l_sp'),性别:val('l_gd'),租借方:val('l_party'),租借日期:val('l_sd'),归还日期:val('l_ed'),状态:val('l_st'),备注:val('l_memo')};
  fetch('/api/loan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(()=>{closeM();boot();})
    .catch(e=>alert('保存失败：'+e.message));
}
function delRec(id){if(!confirm('确认删除该记录？'))return;fetch('/api/total/'+id,{method:'DELETE'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);}).then(()=>boot()).catch(e=>alert('删除失败：'+e.message));}
function markSold(id){if(!confirm('标记为已售并出库？'))return;fetch('/api/mark_sold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_id:id})).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);}).then(()=>boot()).catch(e=>alert('操作失败：'+e.message));}
function anchorSold(id){if(!confirm('标记为已售？'))return;fetch('/api/mark_sold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_id:id})).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);}).then(()=>boot()).catch(e=>alert('操作失败：'+e.message));}
function closeM(){document.getElementById('modal').classList.remove('on');}
function val(i){return document.getElementById(i).value;}
function bind(){document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM();};}
boot();
</script>
