<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>变温领地 · 主播工作台</title><style>
:root{--bg:#F6F8FB;--panel:#FFFFFF;--ink:#1F2A37;--muted:#64748B;
--line:#E5EAF0;--soft:#EEF2F7;--blue:#2F6FED;--blue-d:#1E54C4;
--coral:#E5484D;--ink-soft:#475569}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-weight:700}
header{padding:26px 22px 16px;background:linear-gradient(180deg,#FFFFFF,#FBFAF7);border-bottom:3px solid var(--blue)}
h1{margin:0;font-weight:800;letter-spacing:1px;font-size:24px;color:var(--ink)}
h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--blue);margin-right:10px;vertical-align:middle}
.sub{color:var(--muted);font-size:12px;margin-top:6px;letter-spacing:.5px}
nav{display:flex;background:#1E293B}
nav a{flex:1;text-align:center;color:#CBD5E1;text-decoration:none;padding:13px 6px;font-size:13px;letter-spacing:1px;border-right:1px solid #334155;font-weight:600}
nav a.active{background:var(--blue);color:#FFFFFF}
nav a:last-child{border-right:none}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 70px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.kpi{flex:1;min-width:108px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(47,111,237,.07)}
.kpi .n{font-size:28px;font-weight:800;color:var(--blue-d);line-height:1}
.kpi .l{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:6px}
.dia{color:var(--blue);font-size:14px}
.btn{background:var(--blue);color:#FFFFFF;border:none;padding:8px 15px;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;border-radius:10px;transition:.15s}
.btn:hover{background:var(--blue-d);color:#fff}
.btn.ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--blue)}
.btn.blood{background:var(--coral);color:#fff}
.btn.blood:hover{background:#C93B40}
.btn.sm{padding:5px 11px;font-size:11px}
.imgc{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eee;display:inline-block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(47,111,237,.10);transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(47,111,237,.18)}
.card img{width:100%;height:170px;object-fit:cover;background:#eee;display:block}
.card .b{padding:12px 14px}
.card .t{font-size:16px;font-weight:800;letter-spacing:.3px}
.card .m{color:var(--muted);font-size:12px;margin-top:4px}
.card .pr{color:var(--blue-d);font-weight:800;margin-top:8px;font-size:15px}
.banner{display:none;background:#E7F7EE;border:1px solid #B7E4C7;color:#1B7A45;padding:10px 14px;font-size:12px;margin:14px 0;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:20px;width:min(540px,92vw);max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h3{font-weight:800;letter-spacing:.5px;margin:0 0 14px}
.fld{margin:10px 0}
.fld label{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);background:#fff;font-size:13px;color:var(--ink);border-radius:10px;outline:none;transition:.15s}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.fld input[readonly]{background:#F5F8FC;color:var(--muted)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.empty{color:var(--muted);font-style:italic;padding:20px 0}
</style></head>
<body>
<nav>
<a class="active" style="cursor:default">主播工作台 · 在售看板</a>
</nav>
<header><h1>变温领地</h1><div class="sub">仅显示在售苗子 · 主播可售看板（只读，仅可确认售出）</div></header>
<div class="wrap">
<div class="banner" id="banner"></div>
<div id="app"></div>
</div>
<div class="modal" id="imgModal"><div class="mbox" id="imgBox"></div></div>
<div class="modal" id="confirmModal"><div class="mbox" id="cBox"></div></div>
<script>
const EMBED={"total":[],"loan":[],"anchor":[]};
let DATA=null,LIVE=false;
async function boot(){
  try{const r=await fetch('/api/data');if(r.ok){DATA=await r.json();LIVE=true;}}catch(e){}
  if(!DATA){DATA=EMBED;LIVE=false;
    const b=document.getElementById('banner');b.style.display='block';
    b.textContent='⚠ 当前为静态快照（只读）。用云端链接打开可编辑并实时同步飞书。';}
  render();
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function img(r){return r.img?('<img class="imgc" src="'+r.img+'">'):'<span class="imgc" style="display:inline-flex;align-items:center;justify-content:center;color:#aaa;font-size:10px">无图</span>';}
function price(r){let p=r['建议价格'];return p?('¥'+esc(p)):'—';}
function kpi(n,l){return '<div class="kpi"><div class="n serif">'+n+'</div><div class="l">'+l+'</div></div>';}
function render(){const app=document.getElementById('app');app.innerHTML=anchorHTML();bind();}
function anchorHTML(){
  const a=(DATA.anchor||[]).filter(r=>r['状态']==='在售'||!r['状态']);
  let h='<div class="kpis">'+kpi(a.length,'在售苗子')+'</div>';
  h+='<p class="sub">仅显示在售苗子 · 主播视角 · '+(LIVE?'点击「确认已售」回写飞书，该苗即从看板移除':'静态快照')+'</p>';
  if(!a.length){h+='<div class="empty">暂无在售</div>';return h;}
  h+='<div class="gallery">';
  a.forEach(r=>{h+='<div class="card"><img src="'+(r.img||'')+'" style="cursor:pointer" onclick="zoom(\''+esc(r.record_id)+'\')" onerror="this.style.background=\'#ddd\'"><div class="b"><div class="t">'+esc(r['抽屉号'])+'</div><div class="m">'+esc(r['品种'])+' · '+esc(r['性别'])+' · '+esc(r['出生日期'])+'</div><div class="m">体重 '+esc(r['体重(g)'])+'g · 供货 ¥'+esc(r['供货价'])+'</div><div class="pr">建议 ¥'+esc(r['建议价格']||'—')+'</div>'+(LIVE?'<button class="btn blood sm" style="margin-top:10px;width:100%" onclick="askSold(\''+esc(r.record_id)+'\')">确认已售</button>':'')+'</div></div>';});
  h+='</div>';return h;
}
function zoom(id){
  const r=(DATA.anchor||[]).find(x=>x.record_id===id); if(!r)return;
  const box=document.getElementById('imgBox');
  box.innerHTML='<h3>'+esc(r['抽屉号'])+'</h3>'+
    '<img src="'+(r.img||'')+'" style="width:100%;border-radius:14px;background:#eee;display:block" onerror="this.style.background=\'#ddd\'">'+
    '<div class="m" style="margin-top:10px">'+esc(r['品种'])+' · '+esc(r['性别'])+' · '+esc(r['出生日期'])+'</div>'+
    '<div class="m">体重 '+esc(r['体重(g)'])+'g · 供货 ¥'+esc(r['供货价'])+' · 建议 ¥'+esc(r['建议价格']||'—')+'</div>'+
    (LIVE?'<div class="mfoot"><button class="btn blood" onclick="askSold(\''+esc(r.record_id)+'\')">确认已售</button></div>':'');
  document.getElementById('imgModal').classList.add('on');
}
function askSold(id){
  const r=(DATA.anchor||[]).find(x=>x.record_id===id); if(!r)return;
  const box=document.getElementById('cBox');
  box.innerHTML='<h3>确认售出</h3>'+
    '<p class="sub">请核对信息后确认。确认后该苗将从主播看板移除，并同步回写飞书总台账。</p>'+
    '<div class="fld"><label>抽屉号</label><input value="'+esc(r['抽屉号'])+'" readonly></div>'+
    '<div class="fld"><label>品种 / 性别</label><input value="'+esc(r['品种'])+' / '+esc(r['性别'])+'" readonly></div>'+
    '<div class="fld"><label>建议价</label><input value="'+esc(r['建议价格']||'—')+'" readonly></div>'+
    '<div class="mfoot"><button class="btn ghost" onclick="closeC()">取消</button><button class="btn blood" onclick="doSold(\''+esc(id)+'\')">确认售出</button></div>';
  document.getElementById('confirmModal').classList.add('on');
}
function doSold(id){
  const r=(DATA.anchor||[]).find(x=>x.record_id===id); if(!r)return;
  const realId=r['源记录ID']||id;
  closeC();
  fetch('/api/mark_sold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_id:realId})})
    .then(r=>r.json()).then(d=>{
      const b=document.getElementById('banner');b.style.display='block';b.style.background='#E7F7EE';b.style.borderColor='#B7E4C7';b.style.color='#1B7A45';
      b.textContent='✓ 已确认售出，该苗已从主播看板移除并同步飞书。';
      setTimeout(()=>{b.style.display='none';},3500);
      boot();
    }).catch(()=>{alert('操作失败，请重试');});
}
function closeC(){document.getElementById('confirmModal').classList.remove('on');}
function closeM(){document.getElementById('imgModal').classList.remove('on');}
function bind(){document.getElementById('imgModal').onclick=e=>{if(e.target.id==='imgModal')closeM();};document.getElementById('confirmModal').onclick=e=>{if(e.target.id==='confirmModal')closeC();};}
boot();
</script>
</body></html>
